plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.49-beta'
}

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

neoForge {
    version = neoforge_version

    def accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (accessTransformer.exists()) {
        accessTransformers.from(accessTransformer.absolutePath)
    }

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()}"
        }
        client {
            client()
        }
        data {
            data()
            programArguments.addAll(
                    '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
            )
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    mavenCentral()
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
    }
    maven {
        name = 'Registrate'
        url = 'https://maven.ithundxr.dev/snapshots'
    }
    maven {
        name = 'ModResources'
        url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven'
    }
}

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }
    compileOnly("net.createmod.ponder:Ponder-NeoForge-${minecraft_version}:${ponder_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")

    runtimeOnly("com.tterrag.registrate:Registrate:${registrate_version}")
    runtimeOnly("net.createmod.ponder:Ponder-NeoForge-${minecraft_version}:${ponder_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

processResources {
    def expandProps = [
            'version'                       : version,
            'group'                         : project.group,
            'minecraft_version'             : minecraft_version,
            'minecraft_version_range'       : minecraft_version_range,
            'mod_name'                      : mod_name,
            'mod_author'                    : mod_author,
            'mod_id'                        : mod_id,
            'license'                       : license,
            'description'                   : project.description,
            'neoforge_version'              : neoforge_version,
            'neoforge_loader_version_range' : neoforge_loader_version_range,
            'neoforge_dependency_version_range': neoforge_dependency_version_range,
            'credits'                       : credits,
            'java_version'                  : java_version
    ]

    filesMatching(['pack.mcmeta', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

sourcesJar {
    from(layout.projectDirectory.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(layout.projectDirectory.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'    : mod_name,
                'Specification-Vendor'   : mod_author,
                'Specification-Version'  : archiveVersion,
                'Implementation-Title'   : project.name,
                'Implementation-Version' : archiveVersion,
                'Implementation-Vendor'  : mod_author,
                'Built-On-Minecraft'     : minecraft_version
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url System.getenv('local_maven_url')
        }
    }
}

tasks.register('cleanOutJars', Delete) {
    group = 'dev-run'
    description = 'Cleans the out_jars folder.'
    delete layout.projectDirectory.dir('out_jars')
}

tasks.register('copyJars', Copy) {
    group = 'build'
    description = 'Copies the final NeoForge JAR file to the out_jars folder.'
    dependsOn 'cleanOutJars', 'build'

    from(layout.buildDirectory.dir('libs')) {
        include "*-${minecraft_version}-${version}.jar"
        exclude "*-sources.jar", "*-dev.jar", "*-shadow.jar", "*-all.jar", "*-javadoc.jar"
    }
    into layout.projectDirectory.dir('out_jars')
}

tasks.register('buildRelease') {
    group = 'dev-run'
    description = 'Generates the NeoForge release JAR in the out_jars folder.'
    dependsOn 'copyJars'
}

tasks.named('runClient') {
    group = 'dev-run'
    description = 'Runs the NeoForge client.'
}

tasks.named('runServer') {
    group = 'dev-run'
    description = 'Runs the NeoForge server.'
}
